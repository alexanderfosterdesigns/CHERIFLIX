name: liquid_glass_flutter
description: Native iOS 26 liquid glass surfaces for Flutter with cross-platform fallbacks.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LiquidGlassFlutterPlugin
