name: Cheriflix Beta Android TV

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a004a6-cheriflix

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze application
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run UI and catalog regression tests
        run: >-
          flutter test
          test/home_screen_test.dart
          test/detail_screen_test.dart
          test/title_info_screen_test.dart
          test/search_screen_test.dart
          test/my_list_screen_test.dart
          test/episodes_screen_test.dart
          test/tv_shortcuts_test.dart
          test/tmdb_media_catalog_service_test.dart

      - name: Create isolated beta release signing key
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          keytool -genkeypair \
            -storetype PKCS12 \
            -keystore android/cheriflix-beta-release.jks \
            -storepass "$password" \
            -keypass "$password" \
            -alias cheriflix-beta \
            -keyalg RSA \
            -keysize 3072 \
            -validity 3650 \
            -dname "CN=Cheriflix Beta, OU=Beta Builds, O=Cheriflix, C=AU"
          cat > android/key.properties <<EOF
          storePassword=$password
          keyPassword=$password
          keyAlias=cheriflix-beta
          storeFile=cheriflix-beta-release.jks
          EOF

      - name: Build signed Android TV release APK
        run: >-
          flutter build apk
          --release
          --target-platform android-arm,android-arm64,android-x64

      - name: Validate APK identity, launcher, ABIs, and signing
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-release.apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/aapt" dump badging "$apk" | tee /tmp/cheriflix-badging.txt
          grep -Fx "application-label:'Cheriflix Beta'" /tmp/cheriflix-badging.txt
          grep -q "^launchable-activity:" /tmp/cheriflix-badging.txt
          grep -q "banner='[^']\+'" /tmp/cheriflix-badging.txt
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          python3 - <<'PY'
          import zipfile
          apk = 'build/app/outputs/flutter-apk/app-release.apk'
          expected = ('armeabi-v7a', 'arm64-v8a', 'x86_64')
          required = ('libapp.so', 'libflutter.so')
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
          missing = [f'lib/{abi}/{library}' for abi in expected for library in required
                     if f'lib/{abi}/{library}' not in names]
          if missing:
              raise SystemExit('Missing Android runtime libraries: ' + ', '.join(missing))
          print('Validated Android TV runtime libraries for: ' + ', '.join(expected))
          PY

      - name: Prepare ready-to-install artifact
        shell: bash
        run: |
          rm -f "ready to install apk"/*.apk
          cp build/app/outputs/flutter-apk/app-release.apk \
            "ready to install apk/Cheriflix-Beta.apk"

      - name: Upload Cheriflix Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: Cheriflix-Beta
          path: ready to install apk/Cheriflix-Beta.apk
          if-no-files-found: error
          retention-days: 30
